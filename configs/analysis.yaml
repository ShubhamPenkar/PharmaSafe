# PharmaSafe Statistical Analysis & Signal Detection Configuration
version: "1.0"

methodology:
  name: "PharmaSafe Pharmacovigilance Signal Engine"
  version: "1.0.0"
  description: "Disproportionality analysis using 2x2 contingency tables on case-level FAERS data"

screening_criteria:
  primary:
    # Minimum number of observed cases (a >= min_cases)
    min_cases: 3
    # Minimum Reporting Odds Ratio lower 95% confidence limit
    min_ror_ci_lower: 1.0
    # Minimum Proportional Reporting Ratio
    min_prr: 2.0
    # Minimum Chi-Square with Yates correction (optional standard threshold)
    min_chi2: 4.0
    # Allowed drug role categories for primary analysis:
    # PS: Primary Suspect
    target_roles: ["PS"]
  
  sensitivity:
    all_suspect:
      min_cases: 3
      target_roles: ["PS", "SS"]
    all_reported:
      min_cases: 3
      target_roles: ["PS", "SS", "C", "I"]

statistics:
  confidence_level: 0.95
  z_score: 1.959963984540054
  zero_cell_correction: 0.5  # Haldane-Anscombe correction applied when any cell is zero
  deduplication_policy: "latest_version_max_fda_dt"

grouping:
  normalize_drug_names: true
  case_insensitive: true
  strip_salts_and_dosages: true

export:
  top_signals_limit: 1000
  gold_signals_path: "data/gold/safety_signals.parquet"
  gold_trends_path: "data/gold/quarterly_safety_trends.parquet"
