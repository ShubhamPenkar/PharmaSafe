# PharmaSafe reference set for validation. Pairs are fixed a priori (not tuned to FAERS output) and are
# evaluated as separate single-term entries, so no term is chosen after seeing the data.
# Absence of a recovery in one reporting window is reported as such, not treated as a software error.
# drug_name is the normalized active ingredient; reaction_term is a MedDRA preferred term.
version: "2.0"

reference_signals:
  # Positive references: association documented in labeling / regulatory action
  - {drug_name: ROFECOXIB, reaction_term: MYOCARDIAL INFARCTION, expected_signal: true,
     regulatory_action: "Voluntary withdrawal (2004) for cardiovascular thrombotic events", evidence_source: "VIGOR trial; FDA public health advisory 2004"}
  - {drug_name: ROSIGLITAZONE, reaction_term: MYOCARDIAL INFARCTION, expected_signal: true,
     regulatory_action: "Boxed warning (2007), later REMS", evidence_source: "Nissen & Wolski, NEJM 2007; FDA safety communications"}
  - {drug_name: ATORVASTATIN, reaction_term: RHABDOMYOLYSIS, expected_signal: true,
     regulatory_action: "Labeled warning for myopathy/rhabdomyolysis (statin class)", evidence_source: "Product labeling"}
  - {drug_name: CIPROFLOXACIN, reaction_term: TENDON RUPTURE, expected_signal: true,
     regulatory_action: "Boxed warning (2008) for tendinitis and tendon rupture", evidence_source: "FDA Drug Safety Communication, fluoroquinolones"}
  - {drug_name: ISOTRETINOIN, reaction_term: CONGENITAL ANOMALY, expected_signal: true,
     regulatory_action: "iPLEDGE REMS (teratogenicity)", evidence_source: "FDA REMS documentation; product labeling"}
  - {drug_name: ISOTRETINOIN, reaction_term: FOETAL MALFORMATION, expected_signal: true,
     regulatory_action: "iPLEDGE REMS (teratogenicity)", evidence_source: "FDA REMS documentation; product labeling"}
  - {drug_name: PEMBROLIZUMAB, reaction_term: MYOCARDITIS, expected_signal: true,
     regulatory_action: "Immune-mediated adverse reactions warning (myocarditis)", evidence_source: "Keytruda prescribing information"}
  - {drug_name: PEMBROLIZUMAB, reaction_term: IMMUNE-MEDIATED MYOCARDITIS, expected_signal: true,
     regulatory_action: "Immune-mediated adverse reactions warning (myocarditis)", evidence_source: "Keytruda prescribing information"}
  - {drug_name: CLOZAPINE, reaction_term: AGRANULOCYTOSIS, expected_signal: true,
     regulatory_action: "Boxed warning for severe neutropenia; Clozapine REMS", evidence_source: "Clozaril prescribing information; FDA REMS"}
  - {drug_name: NATALIZUMAB, reaction_term: PROGRESSIVE MULTIFOCAL LEUKOENCEPHALOPATHY, expected_signal: true,
     regulatory_action: "Boxed warning; TOUCH prescribing program", evidence_source: "Tysabri prescribing information"}
  - {drug_name: AMIODARONE, reaction_term: PULMONARY TOXICITY, expected_signal: true,
     regulatory_action: "Boxed warning for pulmonary toxicity", evidence_source: "Amiodarone prescribing information"}

  # Negative controls: no labeled association known; chosen a priori as pairs not expected to be flagged.
  # A control can still be flagged by confounding or reporting artefacts; that outcome is reported, not hidden.
  - {drug_name: AMOXICILLIN, reaction_term: CONGENITAL ANOMALY, expected_signal: false,
     regulatory_action: "Negative control", evidence_source: "No labeled association"}
  - {drug_name: AMOXICILLIN, reaction_term: MYOCARDIAL INFARCTION, expected_signal: false,
     regulatory_action: "Negative control", evidence_source: "No labeled association"}
  - {drug_name: PEMBROLIZUMAB, reaction_term: TENDON RUPTURE, expected_signal: false,
     regulatory_action: "Negative control", evidence_source: "No labeled association"}
