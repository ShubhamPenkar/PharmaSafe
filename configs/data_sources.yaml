# PharmaSafe Data Sources Configuration
# Official FDA Adverse Event Reporting System (FAERS / AEMS)

version: "2.0"
storage:
  base_dir: "data"
  raw_dir: "data/raw"
  official_raw_dir: "data/raw/official"
  synthetic_dir: "data/synthetic"
  bronze_dir: "data/bronze"
  silver_dir: "data/silver"
  gold_dir: "data/gold"
  manifest_path: "data/raw/manifest.json"
  synthetic_manifest_path: "data/synthetic/manifest.json"

faers_source:
  base_url: "https://fis.fda.gov/content/Exports"
  official_index_url: "https://fis.fda.gov/extensions/FPD-QDE-FAERS/FPD-QDE-FAERS.html"
  official_landing_page: "https://www.fda.gov/drugs/fda-adverse-event-monitoring-system-aems/fda-adverse-event-monitoring-system-aems-latest-quarterly-data-files"
  format: "ASCII"
  delimiter: "$"
  encoding: "utf-8"
  errors: "replace"

